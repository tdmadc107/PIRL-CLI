name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed. Needs the repository secret NPM_TOKEN
# (an npm granular access token that can publish). The tag must match the version in package.json.
# npm signs provenance only for a public repository: a private one publishes without it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci --no-audit --no-fund
      - run: npm run pack:check
      # A version already published by hand (npm publish from a computer) only gets its GitHub release.
      - name: Already on npm?
        id: published
        run: |
          if npm view "$(node -p "require('./package.json').name")@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        run: npm publish ${{ github.event.repository.private == false && '--provenance' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Xem CHANGELOG.md."
        env:
          GH_TOKEN: ${{ github.token }}
